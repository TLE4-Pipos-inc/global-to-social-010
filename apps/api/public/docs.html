<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Reference — Global to Social</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --border: #334155;
        --accent: #38bdf8;
        --sidebar-w: 268px;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        min-height: 100vh;
        font-size: 15px;
        line-height: 1.65;
      }

      /* ── Sidebar ── */
      nav {
        width: var(--sidebar-w);
        height: 100vh;
        background: var(--panel);
        border-right: 1px solid var(--border);
        position: fixed;
        top: 0; left: 0;
        overflow-y: auto;
        padding: 24px 0 48px;
        z-index: 10;
      }

      nav .brand {
        padding: 0 18px 18px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 12px;
      }

      nav .brand strong {
        display: block;
        color: var(--accent);
        font-size: 0.95rem;
      }

      nav .brand span {
        font-size: 0.75rem;
        color: var(--muted);
      }

      nav a {
        display: block;
        padding: 6px 18px;
        color: var(--muted);
        text-decoration: none;
        font-size: 0.83rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: color .12s, background .12s;
        border-left: 2px solid transparent;
      }

      nav a:hover { color: var(--text); }

      nav a.h2 {
        color: #cbd5e1;
        font-weight: 600;
        font-size: 0.86rem;
        margin-top: 6px;
        padding-left: 18px;
        border-left-color: transparent;
      }

      nav a.h3 { padding-left: 30px; }
      nav a.h4 { padding-left: 42px; font-size: 0.78rem; }

      nav a.active {
        color: var(--accent);
        border-left-color: var(--accent);
        background: rgba(56,189,248,.07);
      }

      /* ── Main content ── */
      main {
        margin-left: var(--sidebar-w);
        flex: 1;
        padding: 48px 56px 80px;
        max-width: calc(var(--sidebar-w) + 820px);
        min-width: 0;
      }

      /* ── Rendered markdown styles ── */
      #content h1 {
        font-size: 2rem;
        font-weight: 800;
        background: linear-gradient(135deg, #e2e8f0, #7dd3fc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 10px;
      }

      #content h2 {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--text);
        margin: 48px 0 16px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--border);
      }

      #content h3 {
        font-size: 1rem;
        font-weight: 600;
        color: #7dd3fc;
        margin: 28px 0 10px;
      }

      #content h4 {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: .05em;
        margin: 20px 0 8px;
      }

      #content p {
        color: #cbd5e1;
        margin-bottom: 12px;
      }

      #content a { color: var(--accent); text-decoration: none; }
      #content a:hover { text-decoration: underline; }

      #content ul, #content ol {
        padding-left: 22px;
        margin-bottom: 12px;
        color: #cbd5e1;
      }

      #content li { margin: 4px 0; }

      #content strong { color: var(--text); }

      #content code {
        background: rgba(255,255,255,.08);
        border: 1px solid rgba(255,255,255,.08);
        padding: 1px 6px;
        border-radius: 4px;
        font-family: "Fira Code", Consolas, monospace;
        font-size: 0.85em;
        color: #fca5a5;
      }

      #content pre {
        margin: 12px 0 20px;
        border-radius: 8px;
        border: 1px solid var(--border);
        overflow-x: auto;
      }

      #content pre code {
        background: none;
        border: none;
        padding: 0;
        color: inherit;
        font-size: 0.82rem;
        line-height: 1.6;
      }

      #content table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
        margin: 12px 0 20px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }

      #content thead tr { background: rgba(255,255,255,.04); }

      #content th {
        text-align: left;
        padding: 9px 14px;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .05em;
        color: var(--muted);
        border-bottom: 1px solid var(--border);
      }

      #content td {
        padding: 9px 14px;
        border-bottom: 1px solid rgba(51,65,85,.5);
        vertical-align: top;
      }

      #content tr:last-child td { border-bottom: none; }

      #content blockquote {
        border-left: 3px solid var(--accent);
        padding: 10px 16px;
        margin: 16px 0;
        background: rgba(56,189,248,.06);
        border-radius: 0 8px 8px 0;
        color: #cbd5e1;
      }

      #content hr {
        border: none;
        border-top: 1px solid var(--border);
        margin: 40px 0;
      }

      /* ── Loading / error states ── */
      .state {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 32px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .spinner {
        width: 18px; height: 18px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin .7s linear infinite;
        flex-shrink: 0;
      }

      @keyframes spin { to { transform: rotate(360deg); } }

      /* ── Responsive ── */
      @media (max-width: 820px) {
        nav { display: none; }
        main { margin-left: 0; padding: 24px 18px 60px; }
      }
    </style>
  </head>
  <body>
    <nav id="sidebar">
      <div class="brand">
        <strong>Global to Social</strong>
        <span>API Reference</span>
      </div>
    </nav>

    <main>
      <div id="content">
        <div class="state"><div class="spinner"></div> Loading API docs…</div>
      </div>
    </main>

    <script>
      marked.use({ gfm: true, breaks: false })

      async function loadDocs() {
        const contentEl = document.getElementById("content")
        const sidebarEl = document.getElementById("sidebar")

        try {
          const res = await fetch("/api/docs/content")
          if (!res.ok) throw new Error(`${res.status} ${res.statusText}`)
          const markdown = await res.text()

          contentEl.innerHTML = marked.parse(markdown)

          // Add slug IDs to every heading so sidebar anchors work.
          // Matches GitHub's slug rules (each space → one hyphen, no collapsing)
          // so inline Table-of-Contents links resolve the same in this viewer.
          contentEl.querySelectorAll("h1, h2, h3, h4, h5, h6").forEach((h) => {
            h.id = h.textContent.toLowerCase().replace(/[^\w\s-]/g, "").trim().replace(/\s/g, "-")
          })

          // Syntax-highlight fenced code blocks
          contentEl.querySelectorAll("pre code").forEach((block) => hljs.highlightElement(block))

          buildSidebar(sidebarEl, contentEl)
          activateScrollSpy(sidebarEl)
        } catch (err) {
          contentEl.innerHTML = `<div class="state" style="color:#f87171">Failed to load API.md: ${err.message}</div>`
        }
      }

      function buildSidebar(nav, content) {
        const headings = content.querySelectorAll("h1, h2, h3, h4")
        const fragment = document.createDocumentFragment()

        headings.forEach((h) => {
          const a = document.createElement("a")
          a.href = `#${h.id}`
          a.textContent = h.textContent
          a.className = h.tagName.toLowerCase()
          a.addEventListener("click", (e) => {
            e.preventDefault()
            document.getElementById(h.id)?.scrollIntoView({ behavior: "smooth" })
          })
          fragment.appendChild(a)
        })

        nav.appendChild(fragment)
      }

      function activateScrollSpy(nav) {
        const links = nav.querySelectorAll("a[href^='#']")
        const targets = [...links].map((a) => document.getElementById(a.getAttribute("href").slice(1))).filter(Boolean)

        const observer = new IntersectionObserver(
          (entries) => {
            const visible = entries.filter((e) => e.isIntersecting).map((e) => e.target)
            if (visible.length === 0) return
            const top = visible.reduce((a, b) => (a.getBoundingClientRect().top < b.getBoundingClientRect().top ? a : b))
            links.forEach((a) => a.classList.remove("active"))
            const active = nav.querySelector(`a[href="#${top.id}"]`)
            if (active) {
              active.classList.add("active")
              active.scrollIntoView({ block: "nearest" })
            }
          },
          { rootMargin: "-10% 0px -80% 0px" }
        )

        targets.forEach((t) => observer.observe(t))
      }

      loadDocs()
    </script>
  </body>
</html>
